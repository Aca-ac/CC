name: Windows Installer

on:
  workflow_dispatch:

jobs:
  windows-installer:
    name: windows-installer
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Windows installer
        run: npm run dist:win --workspace client

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: chronos-windows-installer
          path: client/release/*.exe
          if-no-files-found: error

  backend-jar:
    name: backend-jar
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Package server
        run: ./server/mvnw -q -DskipTests package

      - name: Upload server jar
        uses: actions/upload-artifact@v4
        with:
          name: chronos-server-jar
          path: server/target/backend-0.0.1-SNAPSHOT.jar
          if-no-files-found: error
