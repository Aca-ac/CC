name: Windows Desktop Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  windows-release:
    name: windows-release
    runs-on: windows-latest
    env:
      VITE_APP_BASE: ./
      VITE_API_BASE_URL: https://vincentt.xyz/chronos/api
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.12.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify release tag matches desktop version
        shell: pwsh
        run: |
          $version = (Get-Content client/package.json -Raw | ConvertFrom-Json).version
          $expectedTag = "v$version"
          if ("${{ github.ref_name }}" -ne $expectedTag) {
            throw "Release tag must be $expectedTag so installed clients can verify the update version."
          }

      - name: Build Windows installer and portable app
        run: npm run dist:win --workspace client

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $assets = Get-ChildItem -Path client/release -File |
            Where-Object {
              $_.Extension -in ".exe", ".blockmap", ".yml" -and $_.Name -ne "builder-debug.yml"
            }
          if (-not $assets) {
            throw "No release assets found in client/release"
          }

          $notes = @"
          Chronos Windows desktop release.

          This first Windows build is unsigned. Windows may show a SmartScreen warning until a code signing certificate is configured.
          "@

          gh release create $tag `
            --repo "${{ github.repository }}" `
            --title "Chronos $tag" `
            --notes $notes `
            --latest `
            $assets.FullName

      - name: Publish update feed to server
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_PORT"
          test -n "$DEPLOY_USER"
          test -n "$DEPLOY_SSH_KEY"

          key="chronos_deploy_key"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$key"
          chmod 600 "$key"

          # 自托管更新源目录（nginx 下以 /chronos/updates/ 提供；放在仓库外，CD 重建 dist 不会清空）
          target="/var/www/chronos-updates"

          ssh -i "$key" -p "$DEPLOY_PORT" \
            -o StrictHostKeyChecking=accept-new -o BatchMode=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p '$target'"

          # 先传二进制（安装包 + blockmap），最后才传 latest.yml，保证 feed 只在
          # 对应版本安装包完整可下载后才「翻新」，避免客户端检测到新版本却下载 404/卡住。
          scp -i "$key" -P "$DEPLOY_PORT" \
            -o StrictHostKeyChecking=accept-new -o BatchMode=yes \
            client/release/Chronos-Setup-*.exe \
            client/release/Chronos-Setup-*.exe.blockmap \
            "$DEPLOY_USER@$DEPLOY_HOST:$target/"

          # latest.yml 单独最后上传，作为发布生效的「开关」。
          scp -i "$key" -P "$DEPLOY_PORT" \
            -o StrictHostKeyChecking=accept-new -o BatchMode=yes \
            client/release/latest.yml \
            "$DEPLOY_USER@$DEPLOY_HOST:$target/"

          rm -f "$key"
