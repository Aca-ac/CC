name: Chronos CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend-check:
    name: frontend-check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and build client
        run: npm run build --workspace client

  backend-test:
    name: backend-test
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: chronos
          MYSQL_USER: chronos
          MYSQL_PASSWORD: chronos_password
          MYSQL_ROOT_PASSWORD: root_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -proot_password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      CHRONOS_MYSQL_URL: jdbc:mysql://127.0.0.1:3306/chronos?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      CHRONOS_MYSQL_USERNAME: chronos
      CHRONOS_MYSQL_PASSWORD: chronos_password
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Initialize database
        run: docker exec "${{ job.services.mysql.id }}" mysql -uroot -proot_password chronos < database/mysql/schema.sql

      - name: Test server and generate coverage report
        run: ./server/mvnw -q test

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: server/target/site/jacoco
          if-no-files-found: warn

  mysql-smoke:
    name: mysql-smoke
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: chronos
          MYSQL_USER: chronos
          MYSQL_PASSWORD: chronos_password
          MYSQL_ROOT_PASSWORD: root_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -proot_password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      CHRONOS_MYSQL_URL: jdbc:mysql://127.0.0.1:3306/chronos?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      CHRONOS_MYSQL_USERNAME: chronos
      CHRONOS_MYSQL_PASSWORD: chronos_password
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Initialize database
        run: docker exec "${{ job.services.mysql.id }}" mysql -uroot -proot_password chronos < database/mysql/schema.sql

      - name: Package server
        run: ./server/mvnw -q -DskipTests package

      - name: Start server and check health endpoint
        shell: bash
        run: |
          nohup java -jar server/target/backend-0.0.1-SNAPSHOT.jar > server.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8080/api/health; then
              exit 0
            fi
            sleep 2
          done
          cat server.log
          exit 1

      - name: Upload server log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mysql-smoke-server-log
          path: server.log
          if-no-files-found: warn
