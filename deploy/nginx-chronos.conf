# Add these location blocks before the root `location /` in the existing
# vincentt.xyz server block. They keep Chronos isolated under /chronos/.

location = /chronos {
    return 301 /chronos/;
}

location /chronos/api/ {
    proxy_pass http://127.0.0.1:8782/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_read_timeout 300s;
    client_max_body_size 20m;
}

location /chronos/ {
    alias /var/www/chronos/client/dist/;
    index index.html;
    try_files $uri $uri/ /chronos/index.html;
}
