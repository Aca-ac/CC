server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: chronos-server
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/chronos?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: password
mybatis-plus:
  # 实体类所在的包路径，换成你项目中 entity 文件夹的实际包名（MP会自动建立类型别名）
  type-aliases-package: com.chronos.entity

  configuration:
    # 开启经典【驼峰命名】与数据库【下划线命名】的自动转换（如数据库 created_at -> Java createdAt）
    map-underscore-to-camel-case: true
    # 全局映射器启用缓存
    cache-enabled: false

  global-config:
    banner: false # 关闭 MyBatis-Plus 启动时的控制台大 Logo
    db-config:
      # 全局主键策略：因为你的 schema.sql 中主键是 VARCHAR(64)，建议用 ASSIGN_ID（雪花算法生成唯一长字符串ID）
      id-type: assign_id
      # 逻辑删除：deleted_at 为 DATETIME 类型，MP 自动用 NOW() / NULL
      logic-delete-field: deletedAt


chronos:
  ai:
    provider: ${CHRONOS_AI_PROVIDER:mock}
    api-key: ${CHRONOS_AI_API_KEY:}
  security:
    jwt-secret: ${CHRONOS_JWT_SECRET:dev-only-change-me}

