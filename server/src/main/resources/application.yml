server:
  port: ${SERVER_PORT:8080}
  # 部署在 nginx 反代后：TLS 在 nginx 终止，后端收到的是明文 HTTP。
  # 让 Spring 识别 nginx 传来的 X-Forwarded-Proto，使 request.isSecure() 在
  # HTTPS 访问时返回 true（否则 BYOK 写入的 HTTPS 校验会误判失败）。
  forward-headers-strategy: framework

spring:
  application:
    name: chronos-server
  jackson:
    serialization:
      write-dates-as-timestamps: false
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${CHRONOS_MYSQL_URL:jdbc:mysql://localhost:3306/chronos?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
    username: ${CHRONOS_MYSQL_USERNAME:chronos}
    password: ${CHRONOS_MYSQL_PASSWORD:chronos_password}
sa-token:
  token-name: satoken
  timeout: 2592000
  active-timeout: -1
  is-concurrent: true
  is-share: true
  token-style: uuid
  is-read-header: true
  is-read-cookie: false
mybatis-plus:
  # 实体类所在的包路径，换成你项目中 entity 文件夹的实际包名（MP会自动建立类型别名）
  type-aliases-package: com.chronos.entity


  configuration:
    # 开启经典【驼峰命名】与数据库【下划线命名】的自动转换（如数据库 created_at -> Java createdAt）
    map-underscore-to-camel-case: true
    # 全局映射器启用缓存
    cache-enabled: false
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    banner: false # 关闭 MyBatis-Plus 启动时的控制台大 Logo
    db-config:
      # 全局主键策略：因为你的 schema.sql 中主键是 VARCHAR(64)，建议用 ASSIGN_ID（雪花算法生成唯一长字符串ID）
      id-type: assign_id
      # 逻辑删除：deleted_at 为 DATETIME 类型，MP 自动用 NOW() / NULL
      logic-delete-field: deletedAt
      logic-not-delete-value: "null"
      logic-delete-value: "now()"

chronos:
  ai:
    provider: ${CHRONOS_AI_PROVIDER:openai-compatible}
    base-url: ${CHRONOS_AI_BASE_URL:https://api.openai.com/v1}
    model: ${CHRONOS_AI_MODEL:gpt-4o-mini}
    api-key: ${CHRONOS_AI_API_KEY:}
    # 服务器内置 AI 分工：拆解走更强的 pro（高推理），每周建议走更快更省的 flash。
    breakdown-model: ${CHRONOS_AI_BREAKDOWN_MODEL:deepseek-v4-pro}
    breakdown-reasoning: ${CHRONOS_AI_BREAKDOWN_REASONING:high}
    advice-model: ${CHRONOS_AI_ADVICE_MODEL:deepseek-v4-flash}
    encryption:
      master-key: ${CHRONOS_AI_MASTER_KEY:dev-master-key-change-me-32byte!}
    providers:
      deepseek:
        endpoint: ${DEEPSEEK_ENDPOINT:https://api.deepseek.com}
        model: ${DEEPSEEK_MODEL:deepseek-v4-flash}
      mimo:
        endpoint: ${MIMO_ENDPOINT:https://api.minimaxi.com}
        model: ${MIMO_MODEL:mimo-v2.5-pro}
      openai:
        endpoint: ${CHRONOS_AI_OPENAI_ENDPOINT:https://api.openai.com}
        model: ${CHRONOS_AI_OPENAI_MODEL:gpt-4o-mini}
    fallback-enabled: ${CHRONOS_AI_FALLBACK:false}
  security:
    jwt-secret: ${CHRONOS_JWT_SECRET:dev-only-change-me}
