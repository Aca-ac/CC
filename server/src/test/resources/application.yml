server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: chronos-server
  jackson:
    serialization:
      write-dates-as-timestamps: false
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:chronos_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=true
    username: sa
    password:
  h2:
    console:
      enabled: true
  sql:
    init:
      mode: always
      schema-locations: classpath:schema-test.sql

mybatis-plus:
  type-aliases-package: com.chronos.entity
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    banner: false
    db-config:
      id-type: assign_id
      logic-delete-field: deletedAt
      logic-not-delete-value: "null"
      logic-delete-value: "now()"

chronos:
  ai:
    provider: mock
    api-key: ""
    encryption:
      master-key: test-master-key-for-unit-tests-32b!
    providers:
      deepseek:
        endpoint: https://api.deepseek.com
        model: deepseek-v4-flash
      mimo:
        endpoint: https://api.minimaxi.com
        model: mimo-v2.5-pro
    fallback-enabled: false
  security:
    jwt-secret: test-jwt-secret-for-unit-tests
